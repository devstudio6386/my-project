<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flavor Fusion - Digital Menu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    /* ============================================
       CSS RESET & BASE STYLES
    ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100%;
      color: #fff;
      overflow-x: hidden;
    }

    /* ============================================
       CSS VARIABLES
    ============================================ */
    :root {
      --primary-gradient: linear-gradient(135deg, #ff4ecd, #4e9bff);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --card-bg: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --shadow-glow: 0 8px 32px rgba(255, 78, 205, 0.3);
      --transition: all 0.3s ease;
      --border-radius: 18px;
    }

    /* ============================================
       MAIN CONTAINER
    ============================================ */
    .app-wrapper {
      width: 100%;
      min-height: 100%;
      padding-bottom: 100px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      overflow-x: hidden;
    }

    /* ============================================
       ANIMATED BACKGROUND ELEMENTS
    ============================================ */
    .bg-blur-circle {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .bg-blur-circle.pink {
      width: 300px;
      height: 300px;
      background: #ff4ecd;
      top: -100px;
      left: -100px;
      animation: float 8s ease-in-out infinite;
    }

    .bg-blur-circle.blue {
      width: 400px;
      height: 400px;
      background: #4e9bff;
      bottom: -150px;
      right: -150px;
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 30px) scale(1.1); }
    }

    /* ============================================
       STICKY HEADER
    ============================================ */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(26, 26, 46, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 20px;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      flex-direction: column;
    }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .logo span {
      font-size: 0.7rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .search-container {
      flex: 1;
      max-width: 400px;
      min-width: 200px;
      position: relative;
    }

    .search-container i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .search-input {
      width: 100%;
      padding: 12px 18px 12px 48px;
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      background: var(--glass-bg);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: 'Poppins', sans-serif;
      transition: var(--transition);
      outline: none;
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .search-input:focus {
      border-color: #ff4ecd;
      box-shadow: 0 0 20px rgba(255, 78, 205, 0.2);
    }

    .cart-btn {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--primary-gradient);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(255, 78, 205, 0.4);
    }

    .cart-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(255, 78, 205, 0.5);
    }

    .cart-btn i {
      color: white;
      font-size: 1.2rem;
    }

    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ff3366;
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #1a1a2e;
      animation: bounce 0.3s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* ============================================
       CATEGORY SECTION
    ============================================ */
    .categories-section {
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .categories-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 10px 5px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .categories-container::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      flex-shrink: 0;
      padding: 12px 24px;
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      background: var(--glass-bg);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .category-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .category-btn.active {
      background: var(--primary-gradient);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 20px rgba(255, 78, 205, 0.4);
      transform: translateY(-2px);
    }

    /* ============================================
       DISHES GRID
    ============================================ */
    .dishes-section {
      padding: 0 20px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title span {
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .dishes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (min-width: 768px) {
      .dishes-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .dishes-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* ============================================
       DISH CARD
    ============================================ */
    .dish-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--border-radius);
      overflow: hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: var(--transition);
      animation: fadeInUp 0.5s ease forwards;
      opacity: 0;
    }

    /* ===== UNAVAILABLE OVERLAY ===== */
.unavailable-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}

.unavailable-overlay span {
  background: #ef4444;
  color: #fff;
  padding: 8px 20px;
  border-radius: 25px;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dish-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-glow);
      border-color: rgba(255, 78, 205, 0.3);
    }

    .dish-image-container {
      position: relative;
      height: 140px;
      overflow: hidden;
    }

    /* ===== UNAVAILABLE OVERLAY ===== */
.unavailable-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}

.unavailable-overlay span {
  background: #ef4444;
  color: #fff;
  padding: 8px 20px;
  border-radius: 25px;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

    .dish-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }

    .dish-card:hover .dish-image {
      transform: scale(1.1);
    }

    .dish-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .dish-badge.veg {
      background: rgba(34, 197, 94, 0.9);
      color: white;
    }

    .dish-badge.non-veg {
      background: rgba(239, 68, 68, 0.9);
      color: white;
    }

    .dish-badge.bestseller {
      background: var(--primary-gradient);
      color: white;
      right: 10px;
      left: auto;
    }

    .dish-content {
      padding: 15px;
    }

    .dish-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 5px;
      line-height: 1.3;
    }

    .dish-description {
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .dish-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dish-price {
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .add-btn {
      padding: 8px 18px;
      border: none;
      border-radius: 25px;
      background: var(--primary-gradient);
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .add-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(255, 78, 205, 0.4);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    /* Ripple Effect */
    .add-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.4s ease, height 0.4s ease;
    }

    .add-btn:active::after {
      width: 200px;
      height: 200px;
    }

    /* Quantity Controls */
    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-gradient);
      border-radius: 25px;
      padding: 4px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .qty-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .qty-value {
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      min-width: 25px;
      text-align: center;
    }

    /* ============================================
       FLOATING BOTTOM CART BAR
    ============================================ */
    .bottom-cart-bar {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 600px;
      background: var(--primary-gradient);
      border-radius: 20px;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -5px 30px rgba(255, 78, 205, 0.4);
      transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 90;
    }

    .bottom-cart-bar.visible {
      bottom: 20px;
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-items-count {
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0.9;
    }

    .cart-total {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .place-order-btn {
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #ff4ecd;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .place-order-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    /* ============================================
       CALL WAITER BUTTON
    ============================================ */
    .call-waiter-btn {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary-gradient);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 25px rgba(255, 78, 205, 0.5);
      transition: var(--transition);
      z-index: 80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 5px 25px rgba(255, 78, 205, 0.5); }
      50% { box-shadow: 0 5px 35px rgba(255, 78, 205, 0.8); }
    }

    .call-waiter-btn:hover {
      transform: scale(1.1);
    }

    .call-waiter-btn i {
      color: white;
      font-size: 1.5rem;
    }

    /* ============================================
       MODAL STYLES
    ============================================ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
      padding: 20px;
    }

    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

   .modal {
  background: linear-gradient(135deg, rgba(26,26,46,0.95), rgba(15,52,96,0.95));
  border: 1px solid var(--glass-border);
  border-radius: var(--border-radius);
  width: 100%;
  max-width: 500px;

  height: 80vh;              /* ADD THIS */
  display: flex;             /* ADD THIS */
  flex-direction: column;    /* ADD THIS */

  overflow: hidden;
  transform: scale(0.9) translateY(20px);
  transition: var(--transition);
}

    .modal-overlay.visible .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      background: var(--primary-gradient);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-close {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .modal-close i {
      color: white;
      font-size: 1rem;
    }

   .modal-body {
  padding: 20px;
  flex: 1;
  overflow-y: auto;
}

    .cart-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: var(--glass-bg);
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--glass-border);
    }

    .cart-item-image {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-name {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .cart-item-price {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-qty-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .cart-qty-btn:hover {
      background: var(--primary-gradient);
      border-color: transparent;
    }

    .cart-qty-btn.remove {
      background: rgba(239, 68, 68, 0.3);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .cart-qty-btn.remove:hover {
      background: rgba(239, 68, 68, 0.6);
    }

    .cart-qty-value {
      font-weight: 600;
      min-width: 25px;
      text-align: center;
    }

    .modal-footer {
      padding: 20px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-total {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-total span {
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .modal-place-order {
      padding: 14px 30px;
      border: none;
      border-radius: 30px;
      background: var(--primary-gradient);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-place-order:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 25px rgba(255, 78, 205, 0.5);
    }

    /* Empty Cart */
    .empty-cart {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-cart i {
      font-size: 4rem;
      color: var(--text-secondary);
      margin-bottom: 15px;
    }

    .empty-cart p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* ============================================
       WAITER CONFIRMATION MODAL
    ============================================ */
    .waiter-modal .modal {
      max-width: 350px;
      text-align: center;
    }

    .waiter-modal .modal-body {
      padding: 40px 30px;
    }

    .waiter-modal .modal-body i {
      font-size: 4rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }

    .waiter-modal .modal-body h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .waiter-modal .modal-body p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .waiter-modal .confirm-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: var(--primary-gradient);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 20px;
    }

    .waiter-modal .confirm-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 20px rgba(255, 78, 205, 0.4);
    }

    /* ============================================
       SUCCESS POPUP
    ============================================ */
    .success-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.98), rgba(15, 52, 96, 0.98));
      border: 1px solid var(--glass-border);
      border-radius: var(--border-radius);
      padding: 50px 40px;
      text-align: center;
      z-index: 1100;
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .success-popup.visible {
      transform: translate(-50%, -50%) scale(1);
    }

    .success-popup .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      animation: successBounce 0.6s ease;
    }

    @keyframes successBounce {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* ============================================
       RESPONSIVE ADJUSTMENTS
    ============================================ */
    @media (max-width: 600px) {

      .call-waiter-btn i {

    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">
 </head>
 <body>
  <div class="app-wrapper"><!-- Animated Background Elements -->
   <div class="bg-blur-circle pink"></div>
   <div class="bg-blur-circle blue"></div><!-- Sticky Header -->
   <header class="header">
    <div class="header-content">
     <div class="logo">
      <h1 id="restaurant-name"></h1>
<span id="tagline"></span>
     </div>
     <div class="search-container"><i class="fas fa-search"></i> <input type="text" class="search-input" id="search-input" placeholder="Search dishes..." aria-label="Search dishes">
     </div><button class="cart-btn" id="cart-btn" aria-label="Open cart"> <i class="fas fa-shopping-bag"></i> <span class="cart-badge" id="cart-badge" style="display: none;">0</span> </button>
    </div>
   </header><!-- Category Section -->
   <section class="categories-section">
    <div class="categories-container" id="categories-container"><!-- Categories will be rendered here -->
    </div>
   </section><!-- Dishes Section -->
   <section class="dishes-section">
    <h2 class="section-title"><i class="fas fa-utensils"></i> <span>Our Menu</span></h2>
    <div class="dishes-grid" id="dishes-grid"><!-- Dishes will be rendered here -->
    </div>
   </section><!-- Floating Bottom Cart Bar -->
   <div class="bottom-cart-bar" id="bottom-cart-bar">
    <div class="cart-info"><span class="cart-items-count" id="cart-items-count">0 items</span> <span class="cart-total" id="cart-total">₹0</span>
    </div><button class="place-order-btn" id="bottom-place-order"> <span>View Cart</span> <i class="fas fa-arrow-right"></i> </button>
   </div><!-- Call Waiter Button --> <button class="call-waiter-btn" id="call-waiter-btn" aria-label="Call waiter"> <i class="fas fa-bell"></i> </button> <!-- Cart Modal -->
   <div class="modal-overlay" id="cart-modal">
    <div class="modal">
     <div class="modal-header">
      <h2><i class="fas fa-shopping-cart"></i> Your Cart</h2><button class="modal-close" id="cart-modal-close" aria-label="Close cart"> <i class="fas fa-times"></i> </button>
     </div>
     <div class="modal-body" id="cart-modal-body"><!-- Cart items will be rendered here -->
     </div>
     <div class="modal-footer" id="cart-modal-footer">
      <div class="modal-total">
       Total: <span id="modal-total">₹0</span>
      </div><button type="button"
        class="modal-place-order"
        id="modal-place-order">
  Place Order
</button>
     </div>
    </div>
   </div><!-- Waiter Confirmation Modal -->
   <div class="modal-overlay waiter-modal" id="waiter-modal">
    <div class="modal">
     <div class="modal-body"><i class="fas fa-concierge-bell"></i>
      <h3>Call Waiter?</h3>
      <p>A waiter will be at your table shortly</p><button class="confirm-btn" id="waiter-confirm">Yes, Call Waiter</button>
     </div>
    </div>
   </div><!-- Waiter Called Confirmation -->
   <div class="modal-overlay waiter-modal" id="waiter-called-modal">
    <div class="modal">
     <div class="modal-body"><i class="fas fa-check-circle"></i>
      <h3>Waiter Called!</h3>
      <p>Our staff will be with you in a moment</p><button class="confirm-btn" id="waiter-called-close">Got it!</button>
     </div>
    </div>
   </div><!-- Success Popup -->
   <div class="success-popup" id="success-popup">
    <div class="checkmark"><i class="fas fa-check"></i>
    </div>
    <h3>Order Placed!</h3>
    <p>Your delicious food is being prepared</p>
   </div>
  </div>
  <script>
    // ============================================
    // CONFIGURATION & DATA
    // ============================================
    
    const defaultConfig = {
      restaurant_name: '',
      tagline: ''
    };

   // ============================================
// SUPABASE CONFIG
// ============================================

const SUPABASE_URL = "https://xtzpxtlqmvpdcrddbbfu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yuYnLF5mlIXpr8gFJ7_p2Q_ob1Ub51F";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Dishes will come from database
let dishes = [];
     
    let restaurantId = null;

// Default table 1
let tableNumber = "1";

// URL se table number read karo
const params = new URLSearchParams(window.location.search);
const tableFromURL = params.get("table");

if (tableFromURL) {
  tableNumber = tableFromURL;
}

console.log("Current table:", tableNumber);

async function loadRestaurant() {

  const restaurantSlug = window.location.pathname.split("/")[1];

  if (!restaurantSlug) {
    console.error("No restaurant slug found in URL");
    return;
  }

  const { data, error } = await supabaseClient
    .from("restaurants")
    .select("*")
    .eq("slug", restaurantSlug)
    .single();

  if (error || !data) {
    console.error("Restaurant not found");
    return;
  }

  restaurantId = data.id;

  onConfigChange({
    restaurant_name: data.name,
    tagline: data.tagline
  });

  fetchDishes();
}

  
     

async function placeOrder() {

  console.log("Cart right now:", cart);

  if (!cart || cart.length === 0) {
    alert("Cart is empty!");
    return;
  }

  if (!restaurantId) {
    alert("Restaurant not loaded yet!");
    return;
  }

  const totalAmount = cart.reduce((sum, item) => {
    const dish = dishes.find(d => d.id === item.id);
    if (!dish) return sum;
    return sum + (dish.price * item.quantity);
  }, 0);

  const { error } = await supabaseClient
    .from("orders")
    .insert([{
      restaurant_id: restaurantId,
      table_number: tableNumber,
      items: cart,
      total_amount: totalAmount,
      status: "pending"
    }]);

  if (error) {
    console.error(error);
    alert("Insert failed");
    return;
  }

  cart = [];
  updateUI();
  cartModal.classList.remove("visible");

  successPopup.classList.add("visible");
  setTimeout(() => {
    successPopup.classList.remove("visible");
  }, 2000);
}

    // Categories
   let categories = ['All'];

    // ============================================
    // STATE MANAGEMENT
    // ============================================
    
    let cart = [];
    let activeCategory = 'All';
    let searchQuery = '';

    // ============================================
    // DOM ELEMENTS
    // ============================================
    
    const categoriesContainer = document.getElementById('categories-container');
    const dishesGrid = document.getElementById('dishes-grid');
    const searchInput = document.getElementById('search-input');
    const cartBadge = document.getElementById('cart-badge');
    const bottomCartBar = document.getElementById('bottom-cart-bar');
    const cartItemsCount = document.getElementById('cart-items-count');
    const cartTotal = document.getElementById('cart-total');
    const cartModal = document.getElementById('cart-modal');
    const cartModalBody = document.getElementById('cart-modal-body');
    const cartModalFooter = document.getElementById('cart-modal-footer');
    const modalTotal = document.getElementById('modal-total');
    const successPopup = document.getElementById('success-popup');
    const waiterModal = document.getElementById('waiter-modal');
    const waiterCalledModal = document.getElementById('waiter-called-modal');

    // ============================================
    // RENDER FUNCTIONS
    // ============================================

    // Render categories
    function renderCategories() {
      categoriesContainer.innerHTML = categories.map(category => `
        <button class="category-btn ${activeCategory === category ? 'active' : ''}" 
                data-category="${category}"
                aria-pressed="${activeCategory === category}">
          ${getCategoryIcon(category)} ${category}
        </button>
      `).join('');
    }

    // Get category icon
    function getCategoryIcon(category) {
      const icons = {
        'All': '🍽️',
        'Starters': '🥗',
        'Main Course': '🍛',
        'Drinks': '🥤',
        'Desserts': '🍰',
        'Chinese': '🥡',
        'Indian': '🍲'
      };
      return icons[category] || '🍽️';
    }

    // Render dishes
    function renderDishes() {
      const filteredDishes = dishes.filter(dish => {
        const matchesCategory = activeCategory === 'All' || dish.category === activeCategory;
       const matchesSearch =
  (dish.name || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
  (dish.description || '').toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filteredDishes.length === 0) {
        dishesGrid.innerHTML = `
          <div class="no-results">
            <i class="fas fa-search"></i>
            <p>No dishes found. Try a different search.</p>
          </div>
        `;
        return;
      }

      dishesGrid.innerHTML = filteredDishes.map((dish, index) => {
        const cartItem = cart.find(item => item.id === dish.id);
        const quantity = cartItem ? cartItem.quantity : 0;

        return `
          <div class="dish-card" style="animation-delay: ${index * 0.05}s">
           <div class="dish-image-container">
  <img src="${dish.image}" alt="${dish.name}" class="dish-image" loading="lazy"
       onerror="this.style.background='linear-gradient(135deg, #ff4ecd, #4e9bff)'; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2250%22 x=%2225%22>🍽️</text></svg>';">
  
  ${dish.is_available === false ? `
    <div class="unavailable-overlay">
      <span>Currently Unavailable</span>
    </div>
  ` : ''}

  <span class="dish-badge ${dish.isVeg ? 'veg' : 'non-veg'}">
    ${dish.isVeg ? '🌱 Veg' : '🍗 Non-Veg'}
  </span>

  ${dish.isBestseller ? '<span class="dish-badge bestseller">⭐ Best</span>' : ''}
</div>
            <div class="dish-content">
              <h3 class="dish-name">${dish.name}</h3>
              <p class="dish-description">${dish.description}</p>
              <div class="dish-footer">
                <span class="dish-price">₹${dish.price}</span>
               ${dish.is_available === false ? `
    <span style="
        color:#ef4444;
        font-weight:600;
        font-size:0.85rem;
    ">
        Currently Unavailable
    </span>
` : quantity > 0 ? `
    <div class="quantity-controls">
        <button class="qty-btn" onclick="updateQuantity(${dish.id}, -1)">
            <i class="fas fa-minus"></i>
        </button>
        <span class="qty-value">${quantity}</span>
        <button class="qty-btn" onclick="updateQuantity(${dish.id}, 1)">
            <i class="fas fa-plus"></i>
        </button>
    </div>
` : `
    <button class="add-btn" onclick="addToCart(${dish.id})">
        <i class="fas fa-plus"></i> Add
    </button>
`}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render cart modal
    function renderCartModal() {
      if (cart.length === 0) {
        cartModalBody.innerHTML = `
          <div class="empty-cart">
            <i class="fas fa-shopping-basket"></i>
            <p>Your cart is empty</p>
          </div>
        `;
        cartModalFooter.style.display = 'none';
        return;
      }

      cartModalFooter.style.display = 'flex';
      
      cartModalBody.innerHTML = cart.map(item => {
        const dish = dishes.find(d => d.id === item.id);
        return `
          <div class="cart-item">
            <img src="${dish.image}" alt="${dish.name}" class="cart-item-image" loading="lazy"
                 onerror="this.style.background='linear-gradient(135deg, #ff4ecd, #4e9bff)'; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2250%22 x=%2225%22>🍽️</text></svg>';">
            <div class="cart-item-details">
              <h4 class="cart-item-name">${dish.name}</h4>
              <p class="cart-item-price">₹${dish.price} × ${item.quantity} = ₹${dish.price * item.quantity}</p>
            </div>
            <div class="cart-item-controls">
              <button class="cart-qty-btn ${item.quantity === 1 ? 'remove' : ''}" 
                      onclick="updateQuantity(${item.id}, -1)"
                      aria-label="${item.quantity === 1 ? 'Remove item' : 'Decrease quantity'}">
                <i class="fas ${item.quantity === 1 ? 'fa-trash' : 'fa-minus'}"></i>
              </button>
              <span class="cart-qty-value">${item.quantity}</span>
              <button class="cart-qty-btn" onclick="updateQuantity(${item.id}, 1)" aria-label="Increase quantity">
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');

      const total = calculateTotal();
      modalTotal.textContent = `₹${total}`;
    }

    // ============================================
    // CART FUNCTIONS
    // ============================================

    // Add to cart
    function addToCart(dishId) {
      const existingItem = cart.find(item => item.id === dishId);
      
      if (existingItem) {
        existingItem.quantity++;
      } else {
        cart.push({ id: dishId, quantity: 1 });
      }

      updateUI();
    }

    // Update quantity
    function updateQuantity(dishId, change) {
      const item = cart.find(item => item.id === dishId);
      
      if (item) {
        item.quantity += change;
        
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.id !== dishId);
        }
      }

      updateUI();
    }

    // Calculate total
    function calculateTotal() {
      return cart.reduce((total, item) => {
        const dish = dishes.find(d => d.id === item.id);
        return total + (dish.price * item.quantity);
      }, 0);
    }

    // Get total items count
    function getTotalItems() {
      return cart.reduce((total, item) => total + item.quantity, 0);
    }

    // Update UI
    function updateUI() {
      renderDishes();
      renderCartModal();
      
      const totalItems = getTotalItems();
      const total = calculateTotal();

      // Update badge
      if (totalItems > 0) {
        cartBadge.textContent = totalItems;
        cartBadge.style.display = 'flex';
        bottomCartBar.classList.add('visible');
      } else {
        cartBadge.style.display = 'none';
        bottomCartBar.classList.remove('visible');
      }

      // Update bottom bar
      cartItemsCount.textContent = `${totalItems} item${totalItems !== 1 ? 's' : ''}`;
      cartTotal.textContent = `₹${total}`;
    }

   
    // ============================================
    // EVENT LISTENERS
    // ============================================

    // Category click
    categoriesContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.category-btn');
      if (btn) {
        activeCategory = btn.dataset.category;
        renderCategories();
        renderDishes();
      }
    });

    // Search input
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderDishes();
    });

    // Cart button
    document.getElementById('cart-btn').addEventListener('click', () => {
      renderCartModal();
      cartModal.classList.add('visible');
    });

    // Cart modal close
    document.getElementById('cart-modal-close').addEventListener('click', () => {
      cartModal.classList.remove('visible');
    });

    // Close modal on overlay click
    cartModal.addEventListener('click', (e) => {
      if (e.target === cartModal) {
        cartModal.classList.remove('visible');
      }
    });

    // Bottom cart bar view cart
    document.getElementById('bottom-place-order').addEventListener('click', () => {
      renderCartModal();
      cartModal.classList.add('visible');
    });

    // Modal place order
    document.getElementById('modal-place-order').addEventListener('click', placeOrder);

    // Call waiter button
    document.getElementById('call-waiter-btn').addEventListener('click', () => {
      waiterModal.classList.add('visible');
    });

    // Waiter modal close on overlay click
    waiterModal.addEventListener('click', (e) => {
      if (e.target === waiterModal) {
        waiterModal.classList.remove('visible');
      }
    });

    // Waiter confirm

document.getElementById('waiter-confirm').addEventListener('click', async () => {

    console.log("Calling waiter...");

    const { error } = await supabaseClient
        .from("waiter_calls")
        .insert([
            {
                restaurant_id: restaurantId,
                table_number: tableNumber,
                status: "pending"
            }
        ]);

    if (error) {
        console.error("Waiter call error:", error);
        alert("Failed to call waiter!");
        return;
    }

    console.log("Waiter call inserted successfully");

    waiterModal.classList.remove('visible');
    waiterCalledModal.classList.add('visible');

});

    // Waiter called close
    document.getElementById('waiter-called-close').addEventListener('click', () => {
      waiterCalledModal.classList.remove('visible');
    });

    // Waiter called modal close on overlay click
    waiterCalledModal.addEventListener('click', (e) => {
      if (e.target === waiterCalledModal) {
        waiterCalledModal.classList.remove('visible');
      }
    });

    // ============================================
    // ELEMENT SDK INITIALIZATION
    // ============================================

    function onConfigChange(config) {
      // Update restaurant name
      const nameEl = document.getElementById('restaurant-name');
      if (nameEl) {
        nameEl.textContent = config.restaurant_name || defaultConfig.restaurant_name;
      }

      // Update tagline
      const taglineEl = document.getElementById('tagline');
      if (taglineEl) {
        taglineEl.textContent = config.tagline || defaultConfig.tagline;
      }
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['restaurant_name', config.restaurant_name || defaultConfig.restaurant_name],
        ['tagline', config.tagline || defaultConfig.tagline]
      ]);
    }

    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }


    async function fetchDishes() {
  const { data, error } = await supabaseClient
    .from("dishes")
    .select("*")
    .eq("restaurant_id", restaurantId);

  if (error) {
    console.error(error);
    return;
  }

  dishes = data;

  // 🔥 AUTO GENERATE CATEGORIES FROM DISHES
  const uniqueCategories = [
    'All',
    ...new Set(
      dishes
        .map(d => d.category)
        .filter(c => c && c.trim() !== '')
    )
  ];

  categories = uniqueCategories;

  renderCategories();   // categories update
  renderDishes();       // dishes render
}
    // ============================================
    // INITIAL RENDER
    // ============================================

    renderCategories();
    loadRestaurant();




  </script>

  <script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js")
    .then(() => console.log("Service Worker Registered"))

}
</script>
