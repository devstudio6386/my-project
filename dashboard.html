<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
      color: white;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }
    .section {
      margin-top: 40px;
      background: rgba(255,255,255,0.05);
      padding: 25px;
      border-radius: 15px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ff4ecd;
      color: white;
      margin: 5px 5px 5px 0;
    }
    button:hover { opacity: 0.85; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: none;
    }
    .badge {
      padding: 5px 10px;
      border-radius: 6px;
      background: green;
      font-size: 14px;
    }
  </style>
</head>

<body>
<div class="container">

<h1>Admin Dashboard</h1>

<div class="section">
  <h2>🛒 Orders</h2>
  <div id="orders"></div>
</div>

<div class="section">
  <h2>🔔 Waiter Calls</h2>
  <div id="waiters"></div>
</div>

<div class="section">
  <h2>🍽 Add / Edit Dish</h2>

  <input type="text" id="dishName" placeholder="Dish Name">
  <input type="number" id="dishPrice" placeholder="Price">
  <input type="text" id="dishImage" placeholder="Image URL">
  <input type="text" id="dishCategory" placeholder="Category">

  <button onclick="addOrUpdateDish()">Save Dish</button>

  <h3>All Dishes</h3>
  <div id="dishList"></div>
</div>

</div>

<script>

const SUPABASE_URL = "https://xtzpxtlqmvpdcrddbbfu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yuYnLF5mlIXpr8gFJ7_p2Q_ob1Ub51F";
const restaurantId = "91c80fd6-375a-47a2-85de-1ccd4b27c3a0";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let editingDishId = null;
let lastOrderCount = 0;
let lastWaiterCount = 0;

const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

/* ================= LOAD ORDERS ================= */

async function loadOrders() {

  const { data } = await supabaseClient
    .from("orders")
    .select("*")
    .eq("restaurant_id", restaurantId)
    .order("created_at", { ascending: false });

  const container = document.getElementById("orders");
  container.innerHTML = "";

  if (!data) return;

  if (data.length > lastOrderCount) {
    audio.play();
  }
  lastOrderCount = data.length;

  for (const order of data) {

    let itemsHTML = "No items";

    if (order.items && Array.isArray(order.items)) {

      const dishIds = order.items.map(i => i.id);

      const { data: dishes } = await supabaseClient
        .from("dishes")
        .select("id,name,price")
        .in("id", dishIds);

      itemsHTML = order.items.map(item => {
        const dish = dishes.find(d => d.id == item.id);
        if (!dish) return "Unknown item";
        return dish.name + " x " + item.quantity +
               " = ₹" + (dish.price * item.quantity);
      }).join("<br>");
    }

    let buttonsHTML = "";

    if (order.status !== "completed") {
      buttonsHTML = `
        <button onclick="updateOrder('${order.id}','preparing')">Preparing</button>
        <button onclick="updateOrder('${order.id}','served')">Served</button>
        <button onclick="updateOrder('${order.id}','completed')">Completed</button>
      `;
    } else {
      buttonsHTML = <span class="badge">Completed</span>;
    }

    container.innerHTML += `
      <div class="card">
        <b>Table:</b> ${order.table_number}<br>
        <b>Status:</b> ${order.status}<br><br>

        <b>Items:</b><br>
        ${itemsHTML}<br><br>

        <b>Total:</b> ₹${order.total_amount}<br><br>
        ${buttonsHTML}
      </div>
    `;
  }
}

async function updateOrder(id, status) {
  await supabaseClient.from("orders")
    .update({ status })
    .eq("id", id);
  loadOrders();
}

/* ================= WAITER ================= */

async function loadWaiters() {

  const { data } = await supabaseClient
    .from("waiter_calls")
    .select("*")
    .eq("restaurant_id", restaurantId)
    .eq("status", "pending");

  const container = document.getElementById("waiters");
  container.innerHTML = "";

  if (!data) return;

  if (data.length > lastWaiterCount) {
    audio.play();
  }
  lastWaiterCount = data.length;

  for (const call of data) {
    container.innerHTML += `
      <div class="card">
        Table ${call.table_number}
        <button onclick="serveWaiter('${call.id}')">Mark Served</button>
      </div>
    `;
  }
}

async function serveWaiter(id) {
  await supabaseClient.from("waiter_calls")
    .update({ status: "served" })
    .eq("id", id);
  loadWaiters();
}

/* ================= DISH ================= */

async function addOrUpdateDish() {

  const name = document.getElementById("dishName").value.trim();
  const price = document.getElementById("dishPrice").value;
  const image = document.getElementById("dishImage").value.trim();
  const category = document.getElementById("dishCategory").value.trim();

  if (!name || !price) return alert("Name & Price required");

  if (editingDishId) {
    await supabaseClient.from("dishes")
      .update({ name, price, image, category })
      .eq("id", editingDishId);
    editingDishId = null;
  } else {
    await supabaseClient.from("dishes")
      .insert([{ restaurant_id: restaurantId, name, price, image, category }]);
  }

  document.getElementById("dishName").value = "";
  document.getElementById("dishPrice").value = "";
  document.getElementById("dishImage").value = "";
  document.getElementById("dishCategory").value = "";

  loadDishes();
}

async function loadDishes() {

  const { data } = await supabaseClient
    .from("dishes")
    .select("*")
    .eq("restaurant_id", restaurantId);

  const container = document.getElementById("dishList");
  container.innerHTML = "";

  for (const dish of data) {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      ${dish.name} - ₹${dish.price}
      <button class="edit-btn">Edit</button>
      <button class="delete-btn">Delete</button>
    `;

    card.querySelector(".edit-btn").onclick = () => {
      document.getElementById("dishName").value = dish.name;
      document.getElementById("dishPrice").value = dish.price;
      document.getElementById("dishImage").value = dish.image || "";
      document.getElementById("dishCategory").value = dish.category || "";
      editingDishId = dish.id;
    };

    card.querySelector(".delete-btn").onclick = async () => {
      if (confirm("Delete this dish?")) {
        await supabaseClient.from("dishes")
          .delete()
          .eq("id", dish.id);
        loadDishes();
      }
    };

    container.appendChild(card);
  }
}

/* ================= REALTIME ================= */

supabaseClient.channel("orders-channel")
  .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "orders",
      filter: "restaurant_id=eq." + restaurantId
    },
    () => loadOrders()
  ).subscribe();

supabaseClient.channel("waiter-channel")
  .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "waiter_calls",
      filter: "restaurant_id=eq." + restaurantId
    },
    () => loadWaiters()
  ).subscribe();

/* ================= INIT ================= */

loadOrders();
loadWaiters();
loadDishes();

</script>
</body>
</html>
