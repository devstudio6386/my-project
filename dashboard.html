<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:'Poppins',sans-serif;
  background:#0f172a;
  color:#fff;
  margin:0;
  padding:20px;
}

h2{margin-bottom:20px;}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin:15px 0;
  border:1px solid #334155;
}

button{
  padding:8px 16px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:600;
  background:linear-gradient(45deg,#ff4ecd,#4e73ff);
  color:#fff;
  margin:5px 5px 0 0;
}

input{
  padding:10px;
  border-radius:10px;
  border:1px solid #334155;
  background:#1e293b;
  color:#fff;
  width:100%;
  max-width:250px;
  margin:5px 5px 0 0;
}

#stats{
  display:flex;
  gap:15px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

#stats .card{
  flex:1;
  min-width:150px;
  text-align:center;
}

#modules{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-bottom:25px;
}

.module-btn{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  border:1px solid #334155;
  transition:.3s;
}

.module-btn:hover{
  background:#243046;
}

.section{
  display:none;
}

.new-badge{
  background:#ef4444;
  color:#fff;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  margin-left:10px;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0.3;}
  100%{opacity:1;}
}
</style>
</head>
<body>

<h2>🍴 Dashboard</h2>

<div id="stats"></div>

<div id="modules">
  <div class="module-btn" onclick="showSection('trackOrders')">📦 Track Orders</div>
  <div class="module-btn" onclick="showSection('orderManagement')">📊 Order Management</div>
  <div class="module-btn" onclick="showSection('manageDashboard')">🍽 Manage Dishes</div>
</div>

<!-- TRACK -->
<div id="trackOrders" class="section">
  <h3>🛒 Live Orders</h3>
  <div id="orders"></div>

  <h3>🔔 Waiter Calls</h3>
  <div id="waiters"></div>
</div>

<!-- ORDER MANAGEMENT -->
<div id="orderManagement" class="section">
  <h3>📊 Today Orders</h3>
  <button onclick="downloadTodayReport()">Download Today Report</button>
  <div id="orders"></div>
</div>

<!-- MANAGE DASHBOARD -->
<div id="manageDashboard" class="section">
  <h3>➕ Add Dish</h3>
  <input id="name" placeholder="Name">
  <input id="price" type="number" placeholder="Price">
  <input id="category" placeholder="Category">
  <input id="image" placeholder="Image URL">
  <button onclick="saveDish()">Save</button>

  <h3 style="margin-top:30px;">📋 All Dishes</h3>
  <div id="dishes"></div>
</div>

<script>
const SUPABASE_URL = "https://xtzpxtlqmvpdcrddbbfu.supabase.co";
const SUPABASE_KEY = "sb_publishable_yuYnLF5mlIXpr8gFJ7_p2Q_ob1Ub51F";
const RESTAURANT_ID = "91c80fd6-375a-47a2-85de-1ccd4b27c3a0";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== SECTION SWITCH ===== */
function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

/* ===== ORDERS ===== */
async function loadOrders(){
  const {data:orders}=await sb.from("orders")
    .select("*")
    .eq("restaurant_id",RESTAURANT_ID)
    .order("created_at",{ascending:false});

  const box=document.getElementById("orders");
  box.innerHTML="";
  if(!orders||orders.length===0){box.innerHTML="No orders";return;}

  const {data:allDishes}=await sb.from("dishes").select("id,name");

  for(let o of orders){
    let itemsHTML="";
    if(o.items){
      for(let item of o.items){
        const dish=allDishes.find(d=>d.id===item.id);
        if(dish) itemsHTML+=dish.name+" × "+item.quantity+"<br>";
      }
    }

    box.innerHTML+=`
      <div class="card">
        <b>
  Table ${o.table_number}
  ${o.status === "pending" ? '<span class="new-badge">NEW</span>' : ''}
</b><br>
        ${itemsHTML}
        <br>Status: ${o.status}
        <br>Total: ₹${o.total_amount}<br>
        <button onclick="updateStatus('${o.id}','preparing')">Preparing</button>
        <button onclick="updateStatus('${o.id}','served')">Served</button>
        <button onclick="updateStatus('${o.id}','completed')">Completed</button>
      </div>
    `;
  }

  loadStats();
}

async function updateStatus(id,status){
  await sb.from("orders").update({status}).eq("id",id);
  loadOrders();
}

/* ===== STATS ===== */
async function loadStats(){
  const today=new Date();
  today.setHours(0,0,0,0);

  const {data:orders}=await sb.from("orders")
    .select("*")
    .eq("restaurant_id",RESTAURANT_ID)
    .gte("created_at",today.toISOString());

  if(!orders)return;

  let revenue=0,pending=0,completed=0;
  orders.forEach(o=>{
    revenue+=o.total_amount;
    if(o.status==="completed") completed++;
    else pending++;
  });

  document.getElementById("stats").innerHTML=`
    <div class="card"><b>₹${revenue}</b><br>Revenue Today</div>
    <div class="card"><b>${orders.length}</b><br>Total Orders</div>
    <div class="card"><b>${completed}</b><br>Completed</div>
    <div class="card"><b>${pending}</b><br>Pending</div>
  `;
}

/* ===== WAITER ===== */
async function loadWaiters(){
  const {data}=await sb.from("waiter_calls")
  .select("*")
  .eq("restaurant_id",RESTAURANT_ID)
  .eq("status","pending");

  const box=document.getElementById("waiters");
  box.innerHTML="";
  if(!data||data.length===0){box.innerHTML="No waiter calls";return;}

  for(let w of data){
    box.innerHTML+=`
      <div class="card">
        Table ${w.table_number}
        <button onclick="doneWaiter('${w.id}')">Done</button>
      </div>
    `;
  }
}

async function doneWaiter(id){
  await sb.from("waiter_calls").update({status:"served"}).eq("id",id);
  loadWaiters();
}

/* ===== DISHES ===== */
async function loadDishes(){
  const {data}=await sb.from("dishes")
  .select("*")
  .eq("restaurant_id",RESTAURANT_ID);

  const box=document.getElementById("dishes");
  box.innerHTML="";
  if(!data)return;

  for(let d of data){
    box.innerHTML+=`
      <div class="card">
        <b>${d.name}</b> ₹${d.price}
        <button onclick="editDish('${d.id}')">Edit</button>
        <button onclick="deleteDish('${d.id}')">Delete</button>
      </div>
    `;
  }
}

function editDish(id){
  sb.from("dishes").select("*").eq("id",id).single()
  .then(res=>{
    const d=res.data;
    document.getElementById("name").value=d.name;
    document.getElementById("price").value=d.price;
    document.getElementById("category").value=d.category;
    document.getElementById("image").value=d.image;
    editingId=id;
  });
}

async function saveDish(){
  const name=document.getElementById("name").value;
  const price=parseFloat(document.getElementById("price").value);
  const category=document.getElementById("category").value;
  const image=document.getElementById("image").value;

  if(!name||isNaN(price)){alert("Name & Price required");return;}

  if(editingId){
    await sb.from("dishes")
    .update({name,price,category,image}).eq("id",editingId);
    editingId=null;
    alert("Dish Updated Successfully ✅");
  }else{
    await sb.from("dishes")
    .insert([{restaurant_id:RESTAURANT_ID,name,price,category,image}]);
    alert("Dish Added Successfully ✅");
  }

  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("category").value="";
  document.getElementById("image").value="";

  loadDishes();
}

async function deleteDish(id){
  const confirmDelete=confirm("Delete this dish?");
  if(!confirmDelete) return;

  await sb.from("dishes").delete().eq("id",id);
  alert("Dish Deleted Successfully ❌");
  loadDishes();
}

/* ===== INIT ===== */
loadOrders();
loadWaiters();
loadDishes();
showSection('trackOrders');
// 🔴 REALTIME ORDERS LISTENER
sb.channel('orders-channel')
  .on(
    'postgres_changes',
    {
      event: 'INSERT',
      schema: 'public',
      table: 'orders',
      filter: 'restaurant_id=eq.${RESTAURANT_ID}'
    },
    (payload) => {
      console.log('New order received:', payload);
      loadOrders();
    }
  )
  .subscribe();

async function downloadTodayReport(){

  try {

    const today = new Date();
    today.setHours(0,0,0,0);

   const { data: orders, error } = await sb
  .from("orders")
  .select("*")
  .eq("restaurant_id", RESTAURANT_ID)
  .gte("created_at", today.toISOString())
  .order("created_at", { ascending: true });

    if(error){
      console.error(error);
      alert("Error loading orders");
      return;
    }

    if(!orders || orders.length === 0){
      alert("No orders today");
      return;
    }

    const { data: allDishes } = await sb
      .from("dishes")
      .select("id,name");

    let csv = "Table,Items,Status,Total,Date\n";

    orders.forEach(o => {

      let itemsText = "";

      if(o.items && Array.isArray(o.items)){
        itemsText = o.items.map(item=>{
          const dish = allDishes.find(d=>d.id===item.id);
          return dish ? dish.name + " x" + item.quantity : "";
        }).join(" | ");
      }

      const formattedDate = new Date(o.created_at)
        .toLocaleString("en-IN");

      csv += o.table_number + "," +
             '"' + itemsText + '",' +
             o.status + "," +
             o.total_amount + "," +
             '"' + formattedDate + '"' +
             "\n";

    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "today_orders.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  } catch(err) {
    console.error(err);
    alert("Something went wrong");
  }
}
</script>

</body>
</html>
