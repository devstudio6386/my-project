<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
  font-family:'Poppins',sans-serif;
  background: linear-gradient(135deg,#ff4ecd,#4e73ff);
  color:#fff;
  padding:20px;
  margin:0;
  min-height:100vh;
}

h2{
  font-size:28px;
  margin-bottom:25px;
}

h3{
  margin-bottom:15px;
  display:flex;
  align-items:center;
  gap:10px;
}

section{
  margin-bottom:45px;
}

.card{
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(25px);
  padding:20px;
  margin:16px 0;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
  transition:0.3s ease;
}

.card:hover{
  transform:translateY(-4px);
}

button{
  padding:8px 18px;
  margin:6px 6px 0 0;
  border:none;
  border-radius:30px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s ease;
  background:linear-gradient(45deg,#ff4ecd,#4e73ff);
  color:#fff;
  box-shadow:0 5px 15px rgba(0,0,0,0.25);
}

button:hover{
  transform:scale(1.05);
  opacity:0.9;
}

input{
  padding:10px;
  margin:6px 6px 0 0;
  border:none;
  border-radius:12px;
  width:100%;
  max-width:250px;
  background:rgba(255,255,255,0.2);
  color:white;
  outline:none;
}

input::placeholder{
  color:rgba(255,255,255,0.7);
}

@media(max-width:600px){
  body{ padding:15px; }
}
</style>
</head>
<body>

<h2>🍴 Dashboard</h2>

<section>
<h3>🛒 Orders 
<button onclick="downloadTodayReport()">Download Today Report</button>
</h3>
<div id="orders"></div>
</section>

<section>
<h3>🔔 Waiter Calls</h3>
<div id="waiters"></div>
</section>

<section>
<h3>🍽 Add Dish</h3>
<input id="name" placeholder="Name">
<input id="price" type="number" placeholder="Price">
<input id="category" placeholder="Category">
<input id="image" placeholder="Image URL">
<button onclick="saveDish()">Save</button>
<div id="dishes"></div>
</section>

<script>
const SUPABASE_URL = "https://xtzpxtlqmvpdcrddbbfu.supabase.co";
const SUPABASE_KEY = "sb_publishable_yuYnLF5mlIXpr8gFJ7_p2Q_ob1Ub51F";
const RESTAURANT_ID = "91c80fd6-375a-47a2-85de-1ccd4b27c3a0";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;

/* ================= ORDERS ================= */

async function loadOrders() {
  const { data: orders, error } = await sb
    .from("orders")
    .select("*")
    .eq("restaurant_id", RESTAURANT_ID)
    .order("created_at", { ascending: false });

  const box = document.getElementById("orders");
  box.innerHTML = "";

  if (error || !orders || orders.length === 0) {
    box.innerHTML = "No orders";
    return;
  }

  // 🔥 Fetch all dishes once (performance safe)
  const { data: allDishes } = await sb
    .from("dishes")
    .select("id,name");

  for (let i = 0; i < orders.length; i++) {
    const o = orders[i];

    let itemsHTML = "";

    if (o.items && Array.isArray(o.items)) {
      for (let j = 0; j < o.items.length; j++) {
        const item = o.items[j];
        const dish = allDishes.find(d => d.id === item.id);
        if (dish) {
          itemsHTML += dish.name + " × " + item.quantity + "<br>";
        }
      }
    }

    box.innerHTML +=
      '<div class="card">' +
      '<b>Table ' + o.table_number + '</b><br>' +
      itemsHTML +
      '<br>Status: ' + o.status +
      '<br>Total: ₹' + o.total_amount +
      '<br>' +
      '<button onclick="updateStatus(\'' + o.id + '\',\'preparing\')">Preparing</button>' +
      '<button onclick="updateStatus(\'' + o.id + '\',\'served\')">Served</button>' +
      '<button onclick="updateStatus(\'' + o.id + '\',\'completed\')">Completed</button>' +
      '</div>';
  }
}

async function updateStatus(id, status) {
  await sb.from("orders").update({ status: status }).eq("id", id);
  loadOrders();
}

/* ================= TODAY REPORT ================= */

async function downloadTodayReport() {

  const today = new Date();
  today.setHours(0,0,0,0);

  const { data: orders } = await sb
    .from("orders")
    .select("*")
    .eq("restaurant_id", RESTAURANT_ID)
    .gte("created_at", today.toISOString());

  if (!orders || orders.length === 0) {
    alert("No orders today");
    return;
  }

  // Fetch dishes once
  const { data: allDishes } = await sb
    .from("dishes")
    .select("id,name");

  let csv = "Table,Items,Status,Total,Date\n";

  for (let i = 0; i < orders.length; i++) {
    const o = orders[i];

    let itemsText = "";

    if (o.items && Array.isArray(o.items)) {
      const itemStrings = o.items.map(item => {
        const dish = allDishes.find(d => d.id === item.id);
        if (!dish) return "";
        return dish.name + " x" + item.quantity;
      });
      itemsText = itemStrings.join(" | ");
    }

    const formattedDate = new Date(o.created_at)
      .toLocaleString("en-IN");

    csv +=
      o.table_number + "," +
      '"' + itemsText + '",' +   // important quotes for commas
      o.status + "," +
      o.total_amount + "," +
      '"' + formattedDate + '"' +
      "\n";
  }

  const blob = new Blob([csv], { type: "text/csv" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "today_orders.csv";
  link.click();
}
/* ================= WAITER ================= */

async function loadWaiters() {
  const { data } = await sb
    .from("waiter_calls")
    .select("*")
    .eq("restaurant_id", RESTAURANT_ID)
    .eq("status", "pending");

  const box = document.getElementById("waiters");
  box.innerHTML = "";

  if (!data || data.length === 0) {
    box.innerHTML = "No waiter calls";
    return;
  }

  for (let i = 0; i < data.length; i++) {
    const w = data[i];
    box.innerHTML +=
      '<div class="card">' +
      'Table ' + w.table_number +
      '<button onclick="doneWaiter(\'' + w.id + '\')">Done</button>' +
      '</div>';
  }
}

async function doneWaiter(id) {
  await sb.from("waiter_calls").update({ status: "served" }).eq("id", id);
  loadWaiters();
}

/* ================= DISHES ================= */

async function loadDishes() {
  const { data } = await sb
    .from("dishes")
    .select("*")
    .eq("restaurant_id", RESTAURANT_ID);

  const box = document.getElementById("dishes");
  box.innerHTML = "";

  if (!data) return;

  for (let i = 0; i < data.length; i++) {
    const d = data[i];
    box.innerHTML +=
      '<div class="card">' +
      '<b>' + d.name + '</b> ₹' + d.price +
      '<button onclick="editDish(\'' + d.id + '\')">Edit</button>' +
      '<button onclick="deleteDish(\'' + d.id + '\')">Delete</button>' +
      '</div>';
  }
}

function editDish(id) {
  sb.from("dishes").select("*").eq("id", id).single()
    .then(function(res) {
      const data = res.data;
      document.getElementById("name").value = data.name;
      document.getElementById("price").value = data.price;
      document.getElementById("category").value = data.category;
      document.getElementById("image").value = data.image;
      editingId = id;
    });
}

async function saveDish() {
  const name = document.getElementById("name").value;
  const price = parseFloat(document.getElementById("price").value);
  const category = document.getElementById("category").value;
  const image = document.getElementById("image").value;

  if (!name || isNaN(price)) {
    alert("Name & Price required");
    return;
  }

  if (editingId) {
    await sb.from("dishes")
      .update({ name: name, price: price, category: category, image: image })
      .eq("id", editingId);
    editingId = null;
  } else {
    await sb.from("dishes")
      .insert([{ restaurant_id: RESTAURANT_ID, name: name, price: price, category: category, image: image }]);
  }

  loadDishes();
}

async function deleteDish(id) {
  await sb.from("dishes").delete().eq("id", id);
  loadDishes();
}

/* ================= INIT ================= */

loadOrders();
loadWaiters();
loadDishes();

</script>
</body>
</html>
