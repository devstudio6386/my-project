<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>Admin Dashboard</h1>

<div>
  <h2>Orders</h2>
  <div id="orders">Loading...</div>
</div>

<div>
  <h2>Waiter Calls</h2>
  <div id="waiters">Loading...</div>
</div>

<div>
  <h2>Add / Edit Dish</h2>
  <input id="dishName" placeholder="Name"><br><br>
  <input id="dishPrice" type="number" placeholder="Price"><br><br>
  <input id="dishImage" placeholder="Image URL"><br><br>
  <input id="dishCategory" placeholder="Category"><br><br>
  <button onclick="addOrUpdateDish()">Save Dish</button>

  <h3>All Dishes</h3>
  <div id="dishList">Loading...</div>
</div>

<script>
const SUPABASE_URL = "https://xtzpxtlqmvpdcrddbbfu.supabase.co";
const SUPABASE_ANON_KEY = "PASTE_REAL_ANON_KEY_HERE"; // MUST replace
const restaurantId = "91c80fd6-375a-47a2-85de-1ccd4b27c3a0";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let editingDishId = null;
let dishCache = [];

/* ================== ORDERS ================== */
async function loadOrders() {

  const { data, error } = await sb
    .from("orders")
    .select("*")
    .eq("restaurant_id", restaurantId)
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("orders").innerHTML =
      <p style="color:red">Error: ${error.message}</p>;
    return;
  }

  if (!data.length) {
    document.getElementById("orders").innerHTML = "No Orders Yet";
    return;
  }

  let html = "";

  for (let order of data) {

    html += `
      <div style="border:1px solid #ccc;padding:10px;margin:10px 0">
        <b>Table:</b> ${order.table_number}<br>
        <b>Status:</b> ${order.status}<br>
        <b>Total:</b> ₹${order.total_amount}<br><br>

        <button onclick="updateOrder('${order.id}','preparing')">Preparing</button>
        <button onclick="updateOrder('${order.id}','served')">Served</button>
        <button onclick="updateOrder('${order.id}','completed')">Completed</button>
      </div>
    `;
  }

  document.getElementById("orders").innerHTML = html;
}

async function updateOrder(id, status) {
  await sb.from("orders").update({ status }).eq("id", id);
  loadOrders();
}

/* ================== WAITER ================== */
async function loadWaiters() {

  const { data } = await sb
    .from("waiter_calls")
    .select("*")
    .eq("restaurant_id", restaurantId)
    .eq("status", "pending");

  if (!data.length) {
    document.getElementById("waiters").innerHTML = "No Waiter Calls";
    return;
  }

  let html = "";

  for (let call of data) {
    html += `
      <div style="border:1px solid #ccc;padding:10px;margin:10px 0">
        Table ${call.table_number} is calling
        <button onclick="serveWaiter('${call.id}')">Mark Served</button>
      </div>
    `;
  }

  document.getElementById("waiters").innerHTML = html;
}

async function serveWaiter(id) {
  await sb.from("waiter_calls").update({ status: "served" }).eq("id", id);
  loadWaiters();
}

/* ================== DISHES ================== */
async function loadDishes() {

  const { data } = await sb
    .from("dishes")
    .select("*")
    .eq("restaurant_id", restaurantId);

  dishCache = data;

  if (!data.length) {
    document.getElementById("dishList").innerHTML = "No dishes";
    return;
  }

  let html = "";

  for (let dish of data) {
    html += `
      <div style="border:1px solid #ccc;padding:10px;margin:10px 0">
        ${dish.name} - ₹${dish.price}
        <button onclick="editDish('${dish.id}')">Edit</button>
        <button onclick="deleteDish('${dish.id}')">Delete</button>
      </div>
    `;
  }

  document.getElementById("dishList").innerHTML = html;
}

function editDish(id) {
  const dish = dishCache.find(d => d.id === id);
  document.getElementById("dishName").value = dish.name;
  document.getElementById("dishPrice").value = dish.price;
  document.getElementById("dishImage").value = dish.image || "";
  document.getElementById("dishCategory").value = dish.category || "";
  editingDishId = id;
}

async function addOrUpdateDish() {

  const name = dishName.value.trim();
  const price = parseFloat(dishPrice.value);
  const image = dishImage.value.trim();
  const category = dishCategory.value.trim();

  if (!name || !price) {
    alert("Name & Price required");
    return;
  }

  if (editingDishId) {
    await sb.from("dishes")
      .update({ name, price, image, category })
      .eq("id", editingDishId);
    editingDishId = null;
  } else {
    await sb.from("dishes")
      .insert([{ restaurant_id: restaurantId, name, price, image, category }]);
  }

  dishName.value = "";
  dishPrice.value = "";
  dishImage.value = "";
  dishCategory.value = "";

  loadDishes();
}

async function deleteDish(id) {
  await sb.from("dishes").delete().eq("id", id);
  loadDishes();
}

/* INIT */
loadOrders();
loadWaiters();
loadDishes();
setInterval(() => {
  loadOrders();
  loadWaiters();
}, 5000);

</script>
</body>
</html>
