<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#111;color:#fff;padding:20px}
section{margin-bottom:40px}
.card{background:#1c1c1c;padding:15px;margin:10px 0;border-radius:8px}
button{padding:6px 12px;margin:4px;border:none;border-radius:6px;cursor:pointer}
input{padding:6px;margin:4px}
</style>
</head>
<body>

<h2>🍴 Dashboard</h2>

<section>
<h3>🛒 Orders</h3>
<div id="orders"></div>
</section>

<section>
<h3>🔔 Waiter Calls</h3>
<div id="waiters"></div>
</section>

<section>
<h3>🍽 Add Dish</h3>
<input id="name" placeholder="Name">
<input id="price" type="number" placeholder="Price">
<input id="category" placeholder="Category">
<input id="image" placeholder="Image URL">
<button onclick="saveDish()">Save</button>
<div id="dishes"></div>
</section>

<script>

const SUPABASE_URL = "https://xtzpxtlqmvpdcrddbbfu.supabase.co";
const SUPABASE_KEY = "sb_publishable_yuYnLF5mlIXpr8gFJ7_p2Q_ob1Ub51F";
const RESTAURANT_ID = "91c80fd6-375a-47a2-85de-1ccd4b27c3a0";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;

/* ================= ORDERS ================= */

async function loadOrders(){
  const {data,error} = await sb
    .from("orders")
    .select("*")
    .eq("restaurant_id",RESTAURANT_ID)
    .order("created_at",{ascending:false});

  console.log("Orders:",data,error);

  const box = document.getElementById("orders");
  box.innerHTML="";

  if(!data || data.length===0){
    box.innerHTML="No orders";
    return;
  }

  data.forEach(o=>{
    box.innerHTML+=`
      <div class="card">
        <b>Table ${o.table_number}</b><br>
        Status: ${o.status}<br>
        Total: ₹${o.total_amount}<br>
        <button onclick="updateStatus('${o.id}','preparing')">Preparing</button>
        <button onclick="updateStatus('${o.id}','served')">Served</button>
        <button onclick="updateStatus('${o.id}','completed')">Completed</button>
      </div>
    `;
  });
}

async function updateStatus(id,status){
  await sb.from("orders").update({status}).eq("id",id);
  loadOrders();
}

/* ================= WAITER ================= */

async function loadWaiters(){
  const {data} = await sb
    .from("waiter_calls")
    .select("*")
    .eq("restaurant_id",RESTAURANT_ID)
    .eq("status","pending");

  const box = document.getElementById("waiters");
  box.innerHTML="";

  if(!data || data.length===0){
    box.innerHTML="No waiter calls";
    return;
  }

  data.forEach(w=>{
    box.innerHTML+=`
      <div class="card">
        Table ${w.table_number}
        <button onclick="doneWaiter('${w.id}')">Done</button>
      </div>
    `;
  });
}

async function doneWaiter(id){
  await sb.from("waiter_calls").update({status:"served"}).eq("id",id);
  loadWaiters();
}

/* ================= DISHES ================= */

async function loadDishes(){
  const {data} = await sb
    .from("dishes")
    .select("*")
    .eq("restaurant_id",RESTAURANT_ID);

  const box = document.getElementById("dishes");
  box.innerHTML="";

  if(!data) return;

  data.forEach(d=>{
    box.innerHTML+=`
      <div class="card">
        <b>${d.name}</b> ₹${d.price} (${d.category})
        <button onclick="editDish('${d.id}')">Edit</button>
        <button onclick="deleteDish('${d.id}')">Delete</button>
      </div>
    `;
  });
}

function editDish(id){
  sb.from("dishes").select("*").eq("id",id).single()
  .then(({data})=>{
    document.getElementById("name").value=data.name;
    document.getElementById("price").value=data.price;
    document.getElementById("category").value=data.category;
    document.getElementById("image").value=data.image;
    editingId=id;
  });
}

async function saveDish(){
  const name=document.getElementById("name").value;
  const price=parseFloat(document.getElementById("price").value);
  const category=document.getElementById("category").value;
  const image=document.getElementById("image").value;

  if(!name || !price){
    alert("Name & Price required");
    return;
  }

  if(editingId){
    await sb.from("dishes")
      .update({name,price,category,image})
      .eq("id",editingId);
    editingId=null;
  }else{
    await sb.from("dishes")
      .insert([{restaurant_id:RESTAURANT_ID,name,price,category,image}]);
  }

  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("category").value="";
  document.getElementById("image").value="";

  loadDishes();
}

async function deleteDish(id){
  await sb.from("dishes").delete().eq("id",id);
  loadDishes();
}

/* ================= REALTIME ================= */

sb.channel("orders")
  .on("postgres_changes",
    {event:"*",schema:"public",table:"orders"},
    ()=>loadOrders())
  .subscribe();

sb.channel("waiters")
  .on("postgres_changes",
    {event:"*",schema:"public",table:"waiter_calls"},
    ()=>loadWaiters())
  .subscribe();

loadOrders();
loadWaiters();
loadDishes();

</script>
</body>
</html>
