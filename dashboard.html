<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:'Poppins',sans-serif;
  background:#0f172a;
  color:#fff;
  margin:0;
  padding:20px;
}

h2{margin-bottom:20px;}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin:15px 0;
  border:1px solid #334155;
}

button{
  padding:8px 16px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:600;
  background:linear-gradient(45deg,#ff4ecd,#4e73ff);
  color:#fff;
  margin:5px 5px 0 0;
}

input{
  padding:10px;
  border-radius:10px;
  border:1px solid #334155;
  background:#1e293b;
  color:#fff;
  width:100%;
  max-width:250px;
  margin:5px 5px 0 0;
}

#stats{
  display:flex;
  gap:15px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

#stats .card{
  flex:1;
  min-width:150px;
  text-align:center;
}

#modules{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-bottom:25px;
}

.module-btn{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  border:1px solid #334155;
  transition:.3s;
}

.module-btn:hover{
  background:#243046;
}

.section{
  display:none;
}

.new-badge{
  background:#ef4444;
  color:#fff;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  margin-left:10px;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0.3;}
  100%{opacity:1;}
}

/* ===== NOTIFICATION TOAST ===== */
#toast-container{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

.toast{
  padding:14px 18px;
  border-radius:10px;
  color:#fff;
  font-weight:600;
  margin-bottom:10px;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  animation:slideIn .3s ease;
}

@keyframes slideIn{
  from{transform:translateX(100%);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}
</style>
</head>
<body>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<h2>🍴 Dashboard</h2>

<div id="stats"></div>

<div id="modules">
  <div class="module-btn" onclick="showSection('trackOrders')">📦 Track Orders</div>
  <div class="module-btn" onclick="showSection('orderManagement')">📊 Order Management</div>
  <div class="module-btn" onclick="showSection('manageDashboard')">🍽 Manage Dishes</div>
</div>

<div id="trackOrders" class="section">
  <h3>🛒 Live Orders</h3>
  <div id="orders"></div>

  <h3>🔔 Waiter Calls</h3>
  <div id="waiters"></div>
</div>

<div id="orderManagement" class="section">
  <h3>📊 Today Orders</h3>
  <button onclick="downloadTodayReport()">Download Today Report</button>
  <div id="orders"></div>
</div>

<div id="manageDashboard" class="section">
  <h3>➕ Add Dish</h3>
  <input id="name" placeholder="Name">
  <input id="price" type="number" placeholder="Price">
  <input id="category" placeholder="Category">
  <input id="image" placeholder="Image URL">
  <button onclick="saveDish()">Save</button>

  <h3 style="margin-top:30px;">📋 All Dishes</h3>
  <div id="dishes"></div>
</div>

<script>
const SUPABASE_URL = "https://xtzpxtlqmvpdcrddbbfu.supabase.co";
const SUPABASE_KEY = "sb_publishable_yuYnLF5mlIXpr8gFJ7_p2Q_ob1Ub51F";
const RESTAURANT_ID = "91c80fd6-375a-47a2-85de-1ccd4b27c3a0";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== TOAST FUNCTION ===== */
function showToast(message,color){
  const container=document.getElementById("toast-container");
  const toast=document.createElement("div");
  toast.className="toast";
  toast.style.background=color;
  toast.innerText=message;
  container.appendChild(toast);
  setTimeout(()=>{toast.remove();},4000);
}

/* ===== SECTION SWITCH ===== */
function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

/* ===== ORDERS ===== */
async function loadOrders(){
  const {data:orders}=await sb.from("orders")
    .select("*")
    .eq("restaurant_id",RESTAURANT_ID)
    .order("created_at",{ascending:false});

  const box=document.getElementById("orders");
  box.innerHTML="";
  if(!orders||orders.length===0){box.innerHTML="No orders";return;}

  const {data:allDishes}=await sb.from("dishes").select("id,name");

  for(let o of orders){
    let itemsHTML="";
    if(o.items){
      for(let item of o.items){
        const dish=allDishes.find(d=>d.id===item.id);
        if(dish) itemsHTML+=dish.name+" × "+item.quantity+"<br>";
      }
    }

    box.innerHTML+=`
      <div class="card">
        <b>
  Table ${o.table_number}
  ${o.status === "pending" ? '<span class="new-badge">NEW</span>' : ''}
</b><br>
        ${itemsHTML}
        <br>Status: ${o.status}
        <br>Total: ₹${o.total_amount}<br>
        <button onclick="updateStatus('${o.id}','preparing')">Preparing</button>
        <button onclick="updateStatus('${o.id}','served')">Served</button>
        <button onclick="updateStatus('${o.id}','completed')">Completed</button>
      </div>
    `;
  }

  loadStats();
}

async function updateStatus(id,status){
  await sb.from("orders").update({status}).eq("id",id);
  loadOrders();
}

/* ===== WAITER ===== */
async function loadWaiters(){
  const {data}=await sb.from("waiter_calls")
  .select("*")
  .eq("restaurant_id",RESTAURANT_ID)
  .eq("status","pending");

  const box=document.getElementById("waiters");
  box.innerHTML="";
  if(!data||data.length===0){box.innerHTML="No waiter calls";return;}

  for(let w of data){
    box.innerHTML+=`
      <div class="card">
        Table ${w.table_number}
        <button onclick="doneWaiter('${w.id}')">Done</button>
      </div>
    `;
  }
}

async function doneWaiter(id){
  await sb.from("waiter_calls").update({status:"served"}).eq("id",id);
  loadWaiters();
}

/* ===== INIT ===== */
loadOrders();
loadWaiters();
showSection('trackOrders');

/* ===== REALTIME ORDERS ===== */
const channel = sb.channel('orders-realtime');

channel
  .on(
    'postgres_changes',
    {
      event: 'INSERT',
      schema: 'public',
      table: 'orders'
    },
    (payload) => {
      console.log("🔥 NEW ORDER:", payload);
      showToast("🔥 New Order Received!","#22c55e");
      loadOrders();
    }
  )
  .subscribe((status) => {
    console.log("📡 Status:", status);
  });

/* ===== WAITER REALTIME ===== */
const waiterChannel = sb.channel('waiter-calls-realtime');

waiterChannel
  .on(
    'postgres_changes',
    {
      event: '*',
      schema: 'public',
      table: 'waiter_calls'
    },
    (payload) => {
      console.log("🔔 WAITER EVENT:", payload);
      showToast("🔔 Waiter Called!","#f97316");
      loadWaiters();
    }
  )
  .subscribe((status) => {
    console.log("🛰 WAITER STATUS:", status);
  });
</script>

</body>
</html>
