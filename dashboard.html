<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html{
  scroll-behavior:smooth;
}

body{
  font-family:'Poppins',sans-serif;
  background:#0f172a;
  color:#ffffff;
  padding:20px;
  margin:0;
  min-height:100vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

h2{
  font-size:28px;
  margin-bottom:15px;
  font-weight:700;
  color:#f1f5f9;
}

h3{
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  color:#e2e8f0;
}

.card{
  background:#1e293b;
  padding:22px;
  margin:20px 0;
  border-radius:20px;
  border:1px solid #334155;
  box-shadow:0 10px 30px rgba(0,0,0,0.45);
  transition:0.3s ease;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
}

.card:hover{
  transform:translateY(-5px);
  background:#243046;
}

button{
  padding:10px 20px;
  margin-top:8px;
  border:none;
  border-radius:40px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  transition:0.3s ease;
  background:linear-gradient(45deg,#ff4ecd,#4e73ff);
  color:#fff;
  min-width:95px;
}

button:hover{
  transform:scale(1.07);
  opacity:0.9;
}

input{
  padding:12px;
  margin:10px 10px 0 0;
  border-radius:12px;
  width:100%;
  max-width:260px;
  background:#1e293b;
  border:1px solid #334155;
  color:white;
}

input::placeholder{
  color:#94a3b8;
}

/* ===== STATS LANDSCAPE ===== */

#stats{
  display:flex;
  gap:15px;
  margin-bottom:25px;
  overflow-x:auto;
  padding-bottom:5px;
}

#stats .card{
  min-width:200px;
  flex:1;
  justify-content:center;
  text-align:center;
}

/* ===== MOBILE ===== */

@media(max-width:600px){
  body{padding:16px;}
  .card{flex-direction:column;align-items:flex-start;}
  button{width:100%;text-align:center;}
  #stats{flex-wrap:nowrap;}
}
</style>
</head>
<body>

<h2>🍴 Dashboard</h2>

<div id="stats"></div>

<section>
<h3>🛒 Orders 
<button onclick="downloadTodayReport()">Download Today Report</button>
</h3>
<div id="orders"></div>
</section>

<section>
<h3>🔔 Waiter Calls</h3>
<div id="waiters"></div>
</section>

<section>
<h3>🍽 Add Dish</h3>
<input id="name" placeholder="Name">
<input id="price" type="number" placeholder="Price">
<input id="category" placeholder="Category">
<input id="image" placeholder="Image URL">
<button onclick="saveDish()">Save</button>
<div id="dishes"></div>
</section>

<script>
const SUPABASE_URL = "https://xtzpxtlqmvpdcrddbbfu.supabase.co";
const SUPABASE_KEY = "sb_publishable_yuYnLF5mlIXpr8gFJ7_p2Q_ob1Ub51F";
const RESTAURANT_ID = "91c80fd6-375a-47a2-85de-1ccd4b27c3a0";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;

/* ===== STATUS BADGE ===== */

function getStatusBadge(status){
  if(status === "preparing"){
    return '<span style="padding:6px 12px;border-radius:20px;background:#facc15;color:#000;font-weight:600;">Preparing</span>';
  }
  if(status === "served"){
    return '<span style="padding:6px 12px;border-radius:20px;background:#38bdf8;color:#000;font-weight:600;">Served</span>';
  }
  if(status === "completed"){
    return '<span style="padding:6px 12px;border-radius:20px;background:#22c55e;color:#000;font-weight:600;">Completed</span>';
  }
  return status;
}

/* ===== ORDERS ===== */

async function loadOrders() {
  const { data: orders } = await sb
    .from("orders")
    .select("*")
    .eq("restaurant_id", RESTAURANT_ID)
    .order("created_at", { ascending: false });

  const box = document.getElementById("orders");
  box.innerHTML = "";

  if (!orders || orders.length === 0) {
    box.innerHTML = "No orders";
    return;
  }

  const { data: allDishes } = await sb
    .from("dishes")
    .select("id,name");

  for (let o of orders) {

    let itemsHTML = "";

    if (o.items && Array.isArray(o.items)) {
      for (let item of o.items) {
        const dish = allDishes.find(d => d.id === item.id);
        if (dish) {
          itemsHTML += dish.name + " × " + item.quantity + "<br>";
        }
      }
    }

    box.innerHTML +=
      '<div class="card">' +
      '<b>Table ' + o.table_number + '</b><br>' +
      itemsHTML +
      '<br>Status: ' + getStatusBadge(o.status) +
      '<br>Total: ₹' + o.total_amount +
      '<br>' +
      '<button onclick="updateStatus(\'' + o.id + '\',\'preparing\')">Preparing</button>' +
      '<button onclick="updateStatus(\'' + o.id + '\',\'served\')">Served</button>' +
      '<button onclick="updateStatus(\'' + o.id + '\',\'completed\')">Completed</button>' +
      '</div>';
  }

  loadStats();
}

async function updateStatus(id, status) {
  await sb.from("orders").update({ status: status }).eq("id", id);
  loadOrders();
}

/* ===== STATS ===== */

async function loadStats(){

  const today = new Date();
  today.setHours(0,0,0,0);

  const { data: orders } = await sb
    .from("orders")
    .select("*")
    .eq("restaurant_id", RESTAURANT_ID)
    .gte("created_at", today.toISOString());

  if(!orders) return;

  let revenue = 0;
  let pending = 0;

  orders.forEach(o=>{
    revenue += o.total_amount;
    if(o.status !== "completed"){
      pending++;
    }
  });

  document.getElementById("stats").innerHTML = `
    <div class="card">
      <b>₹${revenue}</b><br>Today Revenue
    </div>
    <div class="card">
      <b>${orders.length}</b><br>Total Orders
    </div>
    <div class="card">
      <b>${pending}</b><br>Pending Orders
    </div>
  `;
}

/* ===== AUTO REFRESH ===== */

setInterval(()=>{
  loadOrders();
  loadWaiters();
},5000);

/* ===== WAITER ===== */

async function loadWaiters() {
  const { data } = await sb
    .from("waiter_calls")
    .select("*")
    .eq("restaurant_id", RESTAURANT_ID)
    .eq("status", "pending");

  const box = document.getElementById("waiters");
  box.innerHTML = "";

  if (!data || data.length === 0) {
    box.innerHTML = "No waiter calls";
    return;
  }

  for (let w of data) {
    box.innerHTML +=
      '<div class="card">' +
      'Table ' + w.table_number +
      '<button onclick="doneWaiter(\'' + w.id + '\')">Done</button>' +
      '</div>';
  }
}

async function doneWaiter(id) {
  await sb.from("waiter_calls").update({ status: "served" }).eq("id", id);
  loadWaiters();
}

/* ===== DISHES ===== */

async function loadDishes() {
  const { data } = await sb
    .from("dishes")
    .select("*")
    .eq("restaurant_id", RESTAURANT_ID);

  const box = document.getElementById("dishes");
  box.innerHTML = "";

  if (!data) return;

  for (let d of data) {
    box.innerHTML +=
      '<div class="card">' +
      '<b>' + d.name + '</b> ₹' + d.price +
      '<button onclick="editDish(\'' + d.id + '\')">Edit</button>' +
      '<button onclick="deleteDish(\'' + d.id + '\')">Delete</button>' +
      '</div>';
  }
}

function editDish(id) {
  sb.from("dishes").select("*").eq("id", id).single()
    .then(function(res) {
      const data = res.data;
      document.getElementById("name").value = data.name;
      document.getElementById("price").value = data.price;
      document.getElementById("category").value = data.category;
      document.getElementById("image").value = data.image;
      editingId = id;
    });
}

async function saveDish() {
  const name = document.getElementById("name").value;
  const price = parseFloat(document.getElementById("price").value);
  const category = document.getElementById("category").value;
  const image = document.getElementById("image").value;

  if (!name || isNaN(price)) {
    alert("Name & Price required");
    return;
  }

  if (editingId) {
    await sb.from("dishes")
      .update({ name: name, price: price, category: category, image: image })
      .eq("id", editingId);
    editingId = null;
  } else {
    await sb.from("dishes")
      .insert([{ restaurant_id: RESTAURANT_ID, name: name, price: price, category: category, image: image }]);
  }

  loadDishes();
}

async function deleteDish(id) {
  await sb.from("dishes").delete().eq("id", id);
  loadDishes();
}

/* ===== INIT ===== */

loadOrders();
loadWaiters();
loadDishes();

</script>
</body>
</html>
