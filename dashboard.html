<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Poppins, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
      color: white;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }
    .section {
      margin-top: 40px;
      background: rgba(255,255,255,0.05);
      padding: 25px;
      border-radius: 15px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ff4ecd;
      color: white;
      margin: 5px 5px 5px 0;
    }
    button:hover {
      opacity: 0.85;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: none;
    }
    .completed-badge {
      background: green;
      padding: 5px 10px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
<div class="container">

<h1>Admin Dashboard</h1>

<div class="section">
  <h2>🛒 Orders</h2>
  <div id="orders"></div>
</div>

<div class="section">
  <h2>🔔 Waiter Calls</h2>
  <div id="waiters"></div>
</div>

<div class="section">
  <h2>🍽 Add / Edit Dish</h2>
  <input id="dishName" placeholder="Dish Name">
  <input id="dishPrice" type="number" placeholder="Price">
  <input id="dishImage" placeholder="Image URL">
  <input id="dishCategory" placeholder="Category">
  <button onclick="addOrUpdateDish()">Save Dish</button>
  <div id="dishList"></div>
</div>

</div>

<script>

const SUPABASE_URL = "https://xtzpxtlqmvpdcrddbbfu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yuYnLF5mlIXpr8gFJ7_p2Q_ob1Ub51F";
const restaurantId = "91c80fd6-375a-47a2-85de-1ccd4b27c3a0";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let editingDishId = null;

/* ================= LOAD ORDERS ================= */

async function loadOrders() {

  const { data, error } = await supabaseClient
    .from("orders")
    .select("*")
    .eq("restaurant_id", restaurantId)
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  const container = document.getElementById("orders");
  container.innerHTML = "";

  if (!data || data.length === 0) {
    container.innerHTML = "<p>No orders yet</p>";
    return;
  }

  for (const order of data) {

    let itemsHTML = "No items";

    if (order.items && Array.isArray(order.items)) {

      const dishIds = order.items.map(i => i.id);

      const { data: dishes } = await supabaseClient
        .from("dishes")
        .select("id,name,price")
        .in("id", dishIds);

      itemsHTML = order.items.map(item => {
        const dish = dishes ? dishes.find(d => d.id == item.id) : null;
        if (!dish) return "Unknown item";
       return '${dish.name} x ${item.quantity} = ₹${dish.price * item.quantity}';
      }).join("<br>");
    }

    let buttonsHTML = "";

    if (order.status !== "completed") {
      buttonsHTML = `
        <button onclick="updateOrder('${order.id}','preparing')">Preparing</button>
        <button onclick="updateOrder('${order.id}','served')">Served</button>
        <button onclick="updateOrder('${order.id}','completed')">Completed</button>
      `;
    } else {
      buttonsHTML = <span class="completed-badge">Completed</span>;
    }

    container.innerHTML += `
      <div class="card">
        <b>Table:</b> ${order.table_number}<br>
        <b>Status:</b> ${order.status}<br><br>
        <b>Items:</b><br>${itemsHTML}<br><br>
        <b>Total:</b> ₹${order.total_amount}<br><br>
        ${buttonsHTML}
      </div>
    `;
  }
}

async function updateOrder(id, status) {
  await supabaseClient
    .from("orders")
    .update({ status: status })
    .eq("id", id);

  loadOrders();
}

/* ================= LOAD WAITER ================= */

async function loadWaiters() {

  const { data, error } = await supabaseClient
    .from("waiter_calls")
    .select("*")
    .eq("restaurant_id", restaurantId)
    .eq("status", "pending");

  if (error) {
    console.error(error);
    return;
  }

  const container = document.getElementById("waiters");
  container.innerHTML = "";

  if (!data || data.length === 0) {
    container.innerHTML = "<p>No pending calls</p>";
    return;
  }

  for (const call of data) {
    container.innerHTML += `
      <div class="card">
        Table ${call.table_number}
        <button onclick="serveWaiter('${call.id}')">Mark Served</button>
      </div>
    `;
  }
}

async function serveWaiter(id) {
  await supabaseClient
    .from("waiter_calls")
    .update({ status: "served" })
    .eq("id", id);

  loadWaiters();
}

/* ================= DISH ================= */

async function addOrUpdateDish() {

  const name = document.getElementById("dishName").value.trim();
  const price = document.getElementById("dishPrice").value;
  const image = document.getElementById("dishImage").value.trim();
  const category = document.getElementById("dishCategory").value.trim();

  if (!name || !price) {
    alert("Name & Price required");
    return;
  }

  if (editingDishId) {
    await supabaseClient
      .from("dishes")
      .update({ name, price, image, category })
      .eq("id", editingDishId);

    editingDishId = null;
  } else {
    await supabaseClient
      .from("dishes")
      .insert([{ restaurant_id: restaurantId, name, price, image, category }]);
  }

  document.getElementById("dishName").value = "";
  document.getElementById("dishPrice").value = "";
  document.getElementById("dishImage").value = "";
  document.getElementById("dishCategory").value = "";

  loadDishes();
}

async function loadDishes() {

  const { data, error } = await supabaseClient
    .from("dishes")
    .select("*")
    .eq("restaurant_id", restaurantId);

  if (error) {
    console.error(error);
    return;
  }

  const container = document.getElementById("dishList");
  container.innerHTML = "";

  for (const dish of data) {

    const safeName = dish.name.replace(/'/g, "\\'");
    const safeImage = (dish.image || "").replace(/'/g, "\\'");
    const safeCategory = (dish.category || "").replace(/'/g, "\\'");

    container.innerHTML += `
      <div class="card">
        ${dish.name} - ₹${dish.price}
        <button onclick="editDish('${dish.id}','${safeName}',${dish.price},'${safeImage}','${safeCategory}')">Edit</button>
        <button onclick="deleteDish('${dish.id}')">Delete</button>
      </div>
    `;
  }
}

function editDish(id, name, price, image, category) {
  document.getElementById("dishName").value = name;
  document.getElementById("dishPrice").value = price;
  document.getElementById("dishImage").value = image;
  document.getElementById("dishCategory").value = category;
  editingDishId = id;
}

async function deleteDish(id) {
  await supabaseClient
    .from("dishes")
    .delete()
    .eq("id", id);

  loadDishes();
}

/* ================= REALTIME + AUTO REFRESH ================= */

supabaseClient.channel("orders-channel")
  .on("postgres_changes", {
    event: "*",
    schema: "public",
    table: "orders",
    filter: "restaurant_id=eq." + restaurantId
  }, () => {
    loadOrders();
  }).subscribe();

supabaseClient.channel("waiter-channel")
  .on("postgres_changes", {
    event: "*",
    schema: "public",
    table: "waiter_calls",
    filter: "restaurant_id=eq." + restaurantId
  }, () => {
    loadWaiters();
  }).subscribe();

/* Backup auto refresh every 5 sec */
setInterval(() => {
  loadOrders();
  loadWaiters();
}, 5000);

loadOrders();
loadWaiters();
loadDishes();

</script>
</body>
</html>
